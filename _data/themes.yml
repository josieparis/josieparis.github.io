# ---------------------------------------------------------------------------
# The Projects page: research themes, each with the study systems inside it.
#
#   id:        anchor for the jump-links (letters, digits, hyphens)
#   title:     section heading
#   intro:     optional one or two sentences under the heading (currently unused)
#   image:     a file in assets/img/ shown beside the intro (optional)
#   systems:   the cards. Each has:
#     title:   card heading
#     species: Latin name(s), rendered in italics (optional)
#     blurb:   one to three sentences (optional)
#     paper:   a paper title, shown in place of / above the blurb (optional)
#     link:    site path to a write-up page, e.g. /projects/guppies/ (optional)
#     url:     external link instead of `link` (optional)
#     link_text: label for the link line; defaults to the URL's host (optional)
#     current: true to show a "Current" pill (optional)
#
# A species can appear under more than one theme — that's the point.
# ---------------------------------------------------------------------------

- id: adaptation
  title: Rapid adaptation to changing environments
  image: guppy.jpg
  image_alt: A male Trinidadian guppy
  systems:
    - title: Trinidadian guppies
      species: Poecilia reticulata
      blurb: >-
        Balancing selection on male colour polymorphism, a large autosomal haplotype behind
        sex-linked colour, and convergent evolution across natural and experimentally
        translocated populations.

    - title: Brown trout and toxic metals
      species: Salmo trutta
      blurb: >-
        Local adaptation to the legacy of Britain's mining history — the genomic signature
        and transcriptional response of metal tolerance, from my PhD through to ongoing work
        on parallel adaptation to minewater pollution.

    - title: King penguins and climate
      species: Aptenodytes patagonicus
      blurb: >-
        Poly2Adapt — temporal genomics across two decades of Subantarctic warming, to detect
        polygenic selection on reproductive fitness in a long-lived wild vertebrate.
      current: true

    - title: Italian house sparrows in cities
      species: Passer italiae
      blurb: >-
        URBANAPT — convergent adaptation to urban environments, with Carlo Polidori at the
        University of Milan.
      current: true

    - title: Bumblebees
      species: Bombus terrestris
      blurb: >-
        Selection despite low genetic diversity and high gene flow in the rapid island invasion
        of Tasmania, and genomic divergence between commercial and wild bees in Sweden.

- id: conservation
  title: Conservation and wildlife genomics
  image: podarcis-raffonei.jpg
  image_alt: An Aeolian wall lizard
  systems:
    - title: Mule deer and chronic wasting disease
      species: Odocoileus hemionus
      blurb: >-
        Population and landscape genomics of CWD transmission, with Chris Funk at Colorado
        State University — plus a critical reanalysis of genomic prediction for CWD in
        white-tailed deer.
      current: true

    - title: Aeolian wall lizard
      species: Podarcis raffonei
      blurb: >-
        Genetic monitoring of Europe's most endangered reptile: does hybridisation with the
        invasive Italian wall lizard threaten the population on Vulcano?

    - title: Rosy finches
      species: Leucosticte
      blurb: >-
        Demographic modelling of Black, Brown-capped and Gray-crowned rosy finches, and the
        loss of adaptive capacity that drives climate vulnerability in this alpine specialist
        complex, with Kristen Ruegg.
      current: true

    - title: Chalk-stream Atlantic salmon
      species: Salmo salar
      blurb: >-
        The salmon of southern England's chalk streams are genetically unique — the case for
        recognising them as a distinct management unit.

    - title: European lobster
      species: Homarus gammarus
      blurb: >-
        Genetic divergence and adaptation of an isolated population in the Netherlands, and
        genomic tools for aquaculture and restocking (BBSRC AquaLeap).

    - title: Nassau grouper
      species: Epinephelus striatus
      blurb: >-
        RAD-seq and in situ monitoring of spawning aggregations in The Bahamas reveal
        fine-scale population structure and the origins of aggregating fish.

- id: demography
  title: Demography, biogeography and speciation
  image: podarcis-siculus.jpg
  image_alt: An Italian wall lizard
  systems:
    - title: Mediterranean wall lizards
      species: Podarcis siculus and relatives
      blurb: >-
        Reconstructing the complex colonisation histories of lizards across Mediterranean
        archipelagos — and showing that genetic depletion doesn't prevent rapid evolution in
        island-introduced lizards.

    - title: Shearwaters and other pelagic seabirds
      blurb: >-
        Species delimitation with genomic data across a speciation continuum, and how
        pervasive, recurrent hybridisation prevents inbreeding depression in Europe's most
        threatened seabird.

    - title: A seabird contact zone
      blurb: >-
        When hybrids take an intermediate route — genetic ancestry shapes migration across the
        contact zone of two closely related seabirds.

    - title: Emperor penguins
      species: Aptenodytes forsteri
      blurb: >-
        Demographic history and selective sweeps from whole genomes of Emperor, King and
        outgroup penguins, and the gene-expression shifts underlying life in the extreme
        Antarctic.


# ---------------------------------------------------------------------------
# The Projects page: research themes, each with the study systems inside it.
#
#   id:        anchor for the jump-links (letters, digits, hyphens)
#   title:     section heading
#   intro:     optional one or two sentences under the heading (currently unused)
#   image:     optional photo beside the heading (currently unused)
#   systems:   the cards. Each has:
#     title:   card heading
#     species: Latin name(s), rendered in italics (optional)
#     blurb:   one to three sentences (optional)
#     paper:   a paper title; shown as the card's hover tooltip (optional)
#     silhouette / silhouette_of / silhouette_credit / silhouette_url:
#              a PhyloPic SVG in assets/img/phylopic/, the taxon it depicts, the
#              artist, and the PhyloPic page — rendered as an icon + a credit line.
#     silhouette_license / silhouette_license_url: set these only when the image is
#              NOT public domain (e.g. CC BY); the credit line then names the artist.
#     link:    site path to a write-up page, e.g. /projects/guppies/ (optional)
#     url:     external link instead of `link` (optional)
#     link_text: label for the link line; defaults to the URL's host (optional)
#     links:   several links instead of one: a list of {text, url} (optional)
#     papers:  list of DOI/preprint URLs exactly as written in publications.yml;
#              each is looked up there and rendered as title + journal + year (optional)
#     current: true to show a "Current" pill (optional)
#
# A species can appear under more than one theme — that's the point.
# ---------------------------------------------------------------------------


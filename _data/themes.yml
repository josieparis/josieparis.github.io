- id: methods
  colour: slate
  title: Methods and training
  systems:
    - title: "Lost in parameter space: a road map for Stacks"
      image: methods/radseq.svg
      image_alt: RAD-seq reads stacked at restriction cut sites along a DNA molecule
      blurb: A method for assembling de novo loci from RAD-seq data.
      url: https://doi.org/10.1111/2041-210X.12775
      link_text: Methods in Ecology and Evolution

    - title: AF-vapeR
      image: methods/afvaper-windows.svg
      image_alt: Genomic windows with per-population allele-frequency change vectors; two windows show parallel change
      blurb: >-
        A multivariate genome scan for detecting parallel evolution from allele-frequency
        change vectors, with Jim Whiting.
      links:
        - text: Methods in Ecology and Evolution
          url: https://besjournals.onlinelibrary.wiley.com/doi/full/10.1111/2041-210X.13952
        - text: GitHub
          url: https://github.com/JimWhiting91/afvaper

    - title: The power of trios
      image: methods/trios.svg
      image_alt: A parent–offspring trio with a recombinant chromosome and a new mutation
      blurb: Using parent–offspring trios to infer population-genetic parameters in non-model species.
      current: true

    - title: Small reusable tools
      image: methods/genotype-plot.svg
      image_alt: A genotype plot
      blurb: >-
        GenotypePlot for visualising genotypes across a genomic region, and gatk-snp-calling
        for running GATK as PBS/SLURM arrays.
      links:
        - text: GenotypePlot
          url: https://github.com/josieparis/genotype_plot
        - text: gatk-snp-calling
          url: https://github.com/josieparis/gatk-snp-calling

    - title: Workshop on Genomics
      image: methods/evomics-logo.png
      image_alt: evomics
      image_fit: logo
      blurb: >-
        Director of the two-week international workshop in Český Krumlov (2023–2026), and
        author of the Genomics Adventure teaching materials.
      url: https://evomics.org/2026-workshop-on-genomics/

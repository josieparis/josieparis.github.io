      species: Aptenodytes patagonicus
      paper: "A chromosome-level genome of the King penguin (Aptenodytes patagonicus): an emerging model in the wild for studying evolution"
      url: https://doi.org/10.1101/2025.03.13.642884
      link_text: Preprint on bioRxiv

    - title: European lobster
      species: Homarus gammarus
      paper: "A high-quality reference genome and tissue expression atlas for the European lobster (Homarus gammarus)"
      url: https://doi.org/10.1093/gbe/evag138
      link_text: Genome Biology and Evolution

    - title: European leaf-toed gecko
      species: Euleptes europaea
      paper: "Chromosome-level genome assembly of the European leaf-toed gecko, Euleptes europaea"
      url: https://doi.org/10.64898/2026.08.10.744031
      link_text: Preprint on bioRxiv

    - title: Tyrrhenian tree frog
      species: Hyla sarda
      paper: "Chromosome-level genome assembly of the Tyrrhenian tree frog, Hyla sarda"
      url: https://doi.org/10.1038/s41597-025-05760-9
      link_text: Scientific Data

    - title: Black-legged kittiwake
      species: Rissa tridactyla
      paper: "A chromosome-level reference genome for the black-legged kittiwake (Rissa tridactyla), a declining circumpolar seabird"
      url: https://doi.org/10.1093/gbe/evad153
      link_text: Genome Biology and Evolution

    - title: Pink sea fan
      species: Eunicella verrucosa
      paper: "The first genome of the cold-water octocoral, the pink sea fan, Eunicella verrucosa"
      url: https://doi.org/10.1093/gbe/evad083
      link_text: Genome Biology and Evolution

    - title: Eurasian woodcock
      species: Scolopax rusticola
      paper: "ERGA-BGE reference genome of the Eurasian Woodcock (Scolopax rusticola), a game bird species with isolated populations of conservation interest"
      url: https://doi.org/10.12688/openreseurope.23370.1
      link_text: Open Research Europe

    - title: White perch
      species: Morone americana
      paper: "Two genomes of the white perch (Morone americana), an ecologically important teleost"
      url: https://doi.org/10.1093/jhered/esaf034
      link_text: Journal of Heredity

- id: methods
  title: Methods and training
  systems:
    - title: A road map for Stacks
      blurb: >-
        “Lost in parameter space” — how to choose de novo RAD-seq assembly parameters, and one
        of Methods in Ecology and Evolution's most-read papers.
      url: https://doi.org/10.1111/2041-210X.12775

    - title: AF-vapeR
      blurb: >-
        A multivariate genome scan for detecting parallel evolution from allele-frequency
        change vectors, with Jim Whiting.
      url: https://github.com/JimWhiting91/afvaper

    - title: The power of trios
      blurb: >-
        Using parent–offspring trios to infer population-genetic parameters — mutation and
        recombination rates — in non-model species.
      current: true

    - title: Small reusable tools
      blurb: >-
        GenotypePlot for visualising genotypes across a genomic region, and gatk-snp-calling
        for running GATK as PBS/SLURM arrays.
      url: https://github.com/josieparis

    - title: Workshop on Genomics
      blurb: >-
        Director of the two-week international workshop in Český Krumlov (2023–2026), and
        author of the Genomics Adventure teaching materials.
      url: https://evomics.org/2026-workshop-on-genomics/

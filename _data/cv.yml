employment:
  - role: Research Scientist
    org: Colorado State University, USA
    dates: Feb 2026 – present
    pi: Chris Funk
    funder: USDA-APHIS
    topic: >-
      Population and landscape genomics to understand the transmission of Chronic Wasting
      Disease (CWD) in mule deer (<em>Odocoileus hemionus</em>): genome annotation, WGS.
    image: cv-mule-deer.jpg

  - role: Visiting Researcher (Guest Associate)
    org: Colorado State University, USA
    dates: May – Dec 2025
    pi: Kristen Ruegg
    funder: NSF
    topic: >-
      Demographic modelling of North American rosy finches (<em>Leucosticte</em> sp.: Black,
      Brown-capped and Gray-crowned): WGS.
    image: cv-rosy-finch.jpg

  - role: Affiliated Researcher
    org: University of Milan, Italy
    dates: Aug – Oct 2025
    pi: Carlo Polidori
    funder: PNRR
    topic: >-
      URBANAPT – convergent adaptation to urban environments in the Italian house sparrow
      (<em>Passer italiae</em>): WGS.
    image: cv-sparrow.png

  - role: MSCA Postdoctoral Fellow
    org: Marche Polytechnic University, Italy
    dates: May 2023 – Apr 2025
    pi: Emiliano Trucchi
    funder: European Union (Horizon Europe Marie Skłodowska-Curie Actions, grant 101068395)
    topic: >-
      Poly2Adapt – quantifying polygenic selection in real-time adaptation to climate change.
      Detecting signatures of rapid adaptation to climate change in the King penguin
      (<em>Aptenodytes patagonicus</em>): genome assembly &amp; annotation, WGS.
    image: cv-king-penguin.png

  - role: Postdoctoral Research Associate
    org: University of Exeter, UK
    dates: Feb – Apr 2023
    pi: Jamie Stevens
    topic: "UK salmonid population genetics: RAD-seq."
    image: cv-salmon.jpeg

  - role: Postdoctoral Research Associate
    org: University of L'Aquila, Italy
    dates: Feb 2022 – Jan 2023
    pi: Daniele Salvi
    funder: PRIN
    topic: >-
      Population and conservation genomics, biogeography and evolution of island-endemic
      Mediterranean reptiles: Aeolian wall lizard (<em>Podarcis raffonei</em>), Italian wall
      lizard (<em>Podarcis siculus</em>), European leaf-toed gecko (<em>Euleptes europaea</em>):
      RAD-seq, WGS.
    image: cv-lizard.jpg

  - role: Postdoctoral Research Associate
    org: University of Exeter, UK
    dates: Jul 2021 – Jan 2022
    pi: Eduarda Santos
    funder: BBSRC AquaLeap
    topic: >-
      Development of genomic tools for the European lobster (<em>Homarus gammarus</em>):
      genome assembly &amp; annotation, GWAS with RAD-seq, epigenetics with RRBS.
    image: cv-lobster.jpg

  - role: Postdoctoral Research Associate
    org: University of Sussex / University of Exeter, UK
    dates: Oct 2017 – Jul 2021
    pi: Bonnie Fraser
    funder: NERC
    topic: >-
      Ecological genomics of the Trinidadian guppy (<em>Poecilia reticulata</em>) including
      balancing selection, convergent evolution and rapid adaptation: genome assembly, WGS,
      Pool-seq and RAD-seq. The contract began at the University of Sussex (1 year); the group
      moved to the University of Exeter when the PI took up a new position.
    image: cv-guppies.jpg

  - role: Graduate Research Assistant
    org: University of Exeter, UK
    dates: Mar – Sep 2017
    pi: Jamie Stevens &amp; Chris Thornton
    funder: CEFAS &amp; The Leverhulme Trust
    topic: >-
      Cost-effective genetic monitoring tools for salmonids (microsatellites, SNP-chip; CEFAS).
      Development and promotion of lateral flow devices to detect the chytrid fungus
      <em>Batrachochytrium dendrobatidis</em>.
    image: cv-frogs.jpg

education:
  - degree: PhD in Molecular Ecology and Evolution
    org: University of Exeter, UK
    dates: Sep 2012 – Apr 2017 (awarded Sep 2017)
    supervisors: Jamie Stevens &amp; Eduarda Santos
    funders: Environment Agency, Westcountry Rivers Trust, University of Exeter
    body: >-
      Roles of phenotypic plasticity and genetic adaptation in the evolution of tolerance to
      toxic metals in brown trout (<em>Salmo trutta</em> L.) using RNA-seq, RAD-seq, and
      physiology experiments.
    thesis: "Brown trout and toxic metals: local adaptation to the legacy of Britain's mining history"

  - degree: BSc in Ecology and Conservation (First Class Honours)
    org: University of Sussex, UK
    dates: Sep 2009 – Jun 2012
    body: >-
      Final-year project: population structure of the Natterjack toad (<em>Epidalea calamita</em>)
      in Poland using microsatellites.
    note: John Maynard Smith Award for the highest grade in the degree programme.


secondments:
  - year: 2022
    body: >-
      Two-week research secondment with Prof. Dan MacQueen & Dr. Tim Bean
      (Roslin Institute, Edinburgh, UK), to collaborate with members of The Roslin
      Institute to generate the first reference genome of the European lobster
      (Homarus gammarus). Output: Paris et al. 2025, bioRxiv.

  - year: 2019
    body: >-
      Two-week research secondment with Prof. Christopher Wheat (Stockholm
      University, Sweden), to analyse pool-seq data to detect signatures of colour
      polymorphism. Publication: Paris et al. 2022, Nature Communications.

  - year: 2016
    body: >-
      Three-month research secondment with Dr Julian Catchen (University of Illinois
      Urbana-Champaign, USA), to develop methods for accurate locus recovery in
      RAD-seq. Publication: Paris et al. 2017, Methods in Ecology and Evolution.


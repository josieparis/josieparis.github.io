professional:
  - title: Director of the Workshop on Genomics, Český Krumlov, Czech Republic
    meta: Two weeks, annually — 2023, 2024, 2025, 2026
    body: >-
      I am the Director of the international Workshop on Genomics, which delivers
      advanced training in bioinformatics analysis of genomic data to ~70
      participants from ~15 countries annually.
    link_text: See the 2025 program
    link_url: https://evomics.org/2025-workshop-on-genomics/

  - title: Genomics Consultant for the National Oceanic and Atmospheric Administration (NOAA)
    body: >-
      I am sub-contracted to provide consultancy, genomics analyses, and advice and
      interpretation for several projects involving the generation and use of genomic
      data for legal and mitigation purposes for damage and injury cases.


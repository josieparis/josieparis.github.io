professional:
  - title: Director, Workshop on Genomics
    org: Český Krumlov, Czech Republic
    meta: 2023 – 2026 · two weeks annually
    body: >-
      International workshop delivering advanced training in bioinformatic analysis of genomic
      data to 65–85 participants from ~15 countries each year. I initiated and managed the Equal
      Opportunities (EO) funding scheme, which supported 3–5 participants annually from low- and
      middle-income countries, enabling participation of researchers from Argentina, Brazil,
      Chile, China, Egypt, Ghana, India, Madagascar, Nigeria and Turkey.
    link_text: 2026 programme
    link_url: https://evomics.org/2026-workshop-on-genomics/

  - title: Co-Director, Workshop on Genomics
    org: Český Krumlov, Czech Republic
    meta: 2019, 2020, 2022

  - title: Sub-contractor, National Oceanic and Atmospheric Administration (NOAA)
    org: USA
    meta: 2023 – present
    body: >-
      Consultancy, genomic analyses, advice and interpretation for projects generating genomic
      data for legal and mitigation purposes in Natural Resource Damage Assessment (NRDA) cases.
      I liaise directly with NOAA Fisheries, Floragenex and legal and fisheries professionals,
      and attend annual meetings to review ongoing projects and plan future NRDA work across the
      USA.

  - title: Editor, Heredity
    meta: Jul 2026 – present
    body: >-
      Handling editor for manuscripts in population and evolutionary genomics, quantitative
      genetics, conservation genetics and speciation.

  - title: Peer reviewer
    meta: Ongoing
    body: >-
      Reviewer for more than ten journals, including Biological Journal of the Linnean Society,
      BMC Genomics, BMC Ecology &amp; Evolution, Communications Biology, Ecology &amp; Evolution,
      Evolutionary Applications, Genome Biology &amp; Evolution, Heredity, Methods in Ecology
      &amp; Evolution, Molecular Ecology, Nature Communications, PLOS One and Wellcome Open
      Research Genome Notes.


    desc: scripts to plot genotypes or allele frequencies in a genomic region
    url: https://github.com/josieparis/genotype_plot
  - name: AF-vapeR
    desc: software for identifying signatures of parallel allele frequency change
    url: https://github.com/JimWhiting91/afvaper


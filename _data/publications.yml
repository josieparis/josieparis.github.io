# ---------------------------------------------------------------------------
# Publications. Source of truth: Josephine_Paris_CV_2026.pdf (Sep 2026).
#
# Three lists: `pipeline` (in prep), `in_review`, and `published`.
# To add a paper, copy an entry and edit it — no HTML to touch.
#
#   authors:  full author string. "Paris JR" is bolded automatically.
#   title:    paper title, no trailing full stop.
#   venue:    journal + volume/pages, or a status note.
#   doi:      full https://doi.org/... URL (renders as the main link)
#   preprint: full URL to a preprint (renders as a "bioRxiv" link)
#   url:      any other link, used when there is no DOI
#   note:     small print under the entry (awards, joint authorship)
#   year:     required for `published` only; drives the year headings.
#   projects: list of project slugs whose pages should show this paper.
# ---------------------------------------------------------------------------

